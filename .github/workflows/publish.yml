name: publish-pypi

# 打 tag（v1.4.2 这种）时自动上传到 PyPI，且**先跑全量测试**：
#   check-version（tag 与 pyproject 版本一致）→ test（782 用例）→ publish
# 测试不过就不发版——PyPI 的版本不可覆盖，发错一次只能再发补丁版。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write          # Trusted Publishing 必需

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tag 必须等于 pyproject 里的版本（否则 PyPI 会 400）
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 '^version *= *' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$TAG  pyproject=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag($TAG) 与 pyproject 版本($VER) 不一致，先改版本号再打 tag"
            exit 1
          fi

  test:
    # 发版门禁：全量用例不过，不许上传 PyPI
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
      - name: 安装 Tk + Xvfb（界面用例需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: 安装项目（含拍照依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[photo]"
      - name: 全量测试（782 用例）
        run: xvfb-run -a python -m unittest discover -s tests -t . -v

  publish:
    needs: [check-version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
